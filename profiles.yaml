# 每个研究方向一份配置。本文件会由 CatchEdge 界面改写，也可以手动编辑。
#
# keywords   发给 arXiv 的检索词（多个用逗号分隔，也可写成列表）
# terms      打分用的领域专有词；留空则退回用 keywords
# categories arXiv 分类，留空 = 不限
# exclude    命中即剔除
# interest   交给模型的兴趣描述，写得越具体判断越准
profiles:
  3dad:
    name: 3D 异常检测
    keywords:
    - 3d anomaly detection
    - point cloud anomaly
    terms:
    - 3d-ad
    - point cloud
    - industrial anomaly
    - multimodal anomaly
    - anomaly localization
    - mvtec
    - real3d-ad
    - eyecandies
    categories:
    - cs.CV
    - cs.LG
    exclude: []
    interest: 工业质检中的无监督 3D 异常检测，关注跨域泛化与统一模型
  mi:
    name: 模态缺失
    keywords:
    - modality-incomplete
    - missing modalities
    terms:
    - missing modality
    - modality missing
    - missing modalities
    - modality-incomplete
    - incomplete multimodal
    - sensor failure
    - degraded modality
    categories:
    - cs.CV
    exclude: []
    interest: 多模态融合在传感器退化/缺失条件下的鲁棒性
